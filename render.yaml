services:
  - type: web
    name: coalguard-platform
    env: docker
    plan: starter
    region: oregon
    dockerfilePath: Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: coalguard-db
          property: connectionString

databases:
  - name: coalguard-db
    plan: starter
    databaseName: coalguard
    user: coalguard_admin
